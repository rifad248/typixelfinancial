<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TyPixel Support Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        corp: { black: '#000000', dark: '#0a0a0a', panel: '#111111', border: '#1f1f1f', text: '#a1a1aa' }
                    }
                }
            }
        }
    </script>
    <style>
        body { -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
    </style>
</head>
<body class="bg-corp-black text-white font-sans h-screen overflow-hidden flex items-center justify-center">
    
    <!-- Login Screen -->
    <div id="login-view" class="w-full max-w-sm p-8 space-y-6 bg-corp-panel rounded border border-corp-border">
        <div class="text-center">
            <h1 class="text-2xl font-bold tracking-tight text-white">TyPixel</h1>
            <p class="text-xs text-corp-text mt-1 uppercase tracking-widest">Support Center</p>
        </div>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="text-xs font-medium text-corp-text uppercase tracking-wider">Username</label>
                <input type="text" id="login-user" class="mt-1 w-full px-3 py-2 bg-corp-black border border-corp-border rounded text-sm text-white focus:outline-none focus:ring-1 focus:ring-purple-500 focus:border-purple-500" required>
            </div>
            <div class="relative">
                <label class="text-xs font-medium text-corp-text uppercase tracking-wider">Password</label>
                <input type="password" id="login-pass" class="mt-1 w-full px-3 py-2 bg-corp-black border border-corp-border rounded text-sm text-white focus:outline-none focus:ring-1 focus:ring-purple-500 focus:border-purple-500" required>
                <button type="button" id="toggle-pass" class="absolute right-3 top-9 text-xs text-corp-text hover:text-white">SHOW</button>
            </div>
            <div class="flex items-center justify-between">
                <label class="flex items-center text-xs text-corp-text"><input type="checkbox" id="remember-me" class="mr-2 rounded bg-corp-black border-corp-border text-purple-600 focus:ring-purple-500">Remember me</label>
                <a href="#" class="text-xs text-purple-500 hover:text-purple-400">Forgot Password?</a>
            </div>
            <button type="submit" id="login-btn" class="w-full py-2 px-4 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded transition-colors">Sign In</button>
            <p id="login-error" class="text-red-500 text-xs text-center hidden">Invalid credentials.</p>
        </form>
    </div>

    <!-- App Shell -->
    <div id="app-view" class="hidden w-full h-full flex">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-64 bg-corp-panel border-r border-corp-border flex flex-col h-full transition-all duration-200 md:translate-x-0 -translate-x-full fixed md:relative z-50">
            <div class="h-16 flex items-center px-6 border-b border-corp-border shrink-0">
                <span class="text-lg font-bold text-white tracking-tight">TyPixel <span class="text-purple-500">.</span></span>
            </div>
            <nav class="flex-1 overflow-y-auto py-4" id="nav-links"></nav>
            <div class="p-4 border-t border-corp-border">
                <button id="logout-btn" class="w-full text-left px-4 py-2 text-xs text-corp-text hover:text-white hover:bg-corp-black rounded transition-colors flex items-center gap-3">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col h-full overflow-hidden bg-corp-black">
            <header class="h-16 bg-corp-panel border-b border-corp-border flex items-center justify-between px-6 shrink-0">
                <button id="menu-toggle" class="md:hidden text-corp-text hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="flex-1 md:flex-none md:max-w-xs px-4">
                    <input type="text" id="global-search" placeholder="Search records..." class="w-full bg-corp-black border border-corp-border rounded py-1.5 px-3 text-xs text-white focus:outline-none focus:ring-1 focus:ring-purple-500">
                </div>
                <div class="relative">
                    <button id="notif-btn" class="text-corp-text hover:text-white relative">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                        <span id="notif-badge" class="absolute top-0 right-0 w-2 h-2 bg-purple-600 rounded-full hidden"></span>
                    </button>
                    <div id="notif-dropdown" class="hidden absolute right-0 mt-2 w-72 bg-corp-panel border border-corp-border rounded shadow-xl py-2 max-h-64 overflow-y-auto z-50"></div>
                </div>
            </header>
            <main id="page-content" class="flex-1 overflow-y-auto p-6"></main>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal-overlay" class="hidden fixed inset-0 bg-black bg-opacity-80 z-[100] flex items-center justify-center p-4">
        <div class="bg-corp-panel w-full max-w-lg rounded border border-corp-border shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex items-center justify-between p-4 border-b border-corp-border">
                <h3 id="modal-title" class="text-lg font-semibold text-white"></h3>
                <button id="modal-close" class="text-corp-text hover:text-white text-xl">&times;</button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto"></div>
        </div>
    </div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbziL2fbvRL5J-toDIewz9K1OZS8HWiTu8K02aa2_1kqxmnEs-fz9mDbiymgXEA7ZWN4/exec';

const App = {
    user: null,
    db: { members: [], salaries: [], income: [], expenses: [], savings: [], activities: [], notifications: [], settings: { companyName: 'TyPixel', currency: '$' } },
    
    init() { this.bindEvents(); this.checkSession(); },

    async apiCall(table, action, payload = null, id = null) {
        let url = `${API_URL}?action=${action}&table=${table}`;
        if (id) url += `&id=${id}`;
        
        // Using 'text/plain' to bypass Google Apps Script CORS Preflight issues
        const options = { method: action === 'read' ? 'GET' : 'POST' };
        if (payload) {
            options.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
            options.body = JSON.stringify(payload);
        }
        
        try {
            const res = await fetch(url, options);
            const data = await res.json();
            return data.data || [];
        } catch (err) {
            console.error("API Error:", err);
            return [];
        }
    },

    async loadDb() {
        this.db.members = await this.apiCall('Members', 'read');
        this.db.salaries = await this.apiCall('Salaries', 'read');
        this.db.income = await this.apiCall('Income', 'read');
        this.db.expenses = await this.apiCall('Expenses', 'read');
        this.db.savings = await this.apiCall('Savings', 'read');
        this.db.activities = await this.apiCall('Activities', 'read');
        this.db.notifications = await this.apiCall('Notifications', 'read');
    },

    checkSession() {
        const session = localStorage.getItem('typixel_session') || sessionStorage.getItem('typixel_session');
        if (session === 'active') { this.user = 'admin'; this.showApp(); } 
        else { this.showLogin(); }
    },

    async login(username, password, remember) {
        document.getElementById('login-btn').textContent = 'Signing In...';
        const users = await this.apiCall('Users', 'read');
        const user = users.find(u => u.username === username && u.password === password);
        
        if (user) {
            this.user = username;
            if (remember) localStorage.setItem('typixel_session', 'active');
            else sessionStorage.setItem('typixel_session', 'active');
            this.showApp();
            return true;
        }
        document.getElementById('login-btn').textContent = 'Sign In';
        return false;
    },

    logout() {
        localStorage.removeItem('typixel_session');
        sessionStorage.removeItem('typixel_session');
        this.user = null;
        this.showLogin();
    },

    async showApp() {
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('app-view').classList.remove('hidden');
        this.setupNav();
        await this.loadDb(); 
        this.navigate(window.location.hash.slice(1) || 'dashboard');
        this.checkNotifications();
    },

    navigate(page) {
        document.getElementById('sidebar').classList.add('-translate-x-full');
        window.location.hash = page;
        document.getElementById('page-content').innerHTML = Pages[page] ? Pages[page].render() : Pages['dashboard'].render();
        if (Pages[page] && Pages[page].init) Pages[page].init();
        document.querySelectorAll('.nav-link').forEach(link => {
            link.classList.toggle('bg-purple-600/10', link.dataset.page === page);
            link.classList.toggle('text-purple-400', link.dataset.page === page);
        });
    },

    setupNav() {
        const navItems = [
            { id: 'dashboard', label: 'Dashboard', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>' },
            { id: 'members', label: 'Members', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>' },
            { id: 'salary', label: 'Salary', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path>' },
            { id: 'income', label: 'Income', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>' },
            { id: 'expenses', label: 'Expenses', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path>' },
            { id: 'savings', label: 'Savings', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>' },
            { id: 'reports', label: 'Reports', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>' }
        ];
        document.getElementById('nav-links').innerHTML = navItems.map(item => `
            <a href="#${item.id}" data-page="${item.id}" class="nav-link flex items-center gap-3 px-4 py-2.5 mx-2 rounded text-xs font-medium text-corp-text hover:bg-corp-black hover:text-white transition-colors mb-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">${item.icon}</svg> ${item.label}
            </a>
        `).join('');
        document.getElementById('nav-links').addEventListener('click', (e) => {
            const link = e.target.closest('.nav-link');
            if (link) this.navigate(link.dataset.page);
        });
    },

    formatCurrency(amount) { return `${this.db.settings.currency}${parseFloat(amount || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}`; },
    formatDate(dateStr) { if(!dateStr) return 'N/A'; return new Date(dateStr).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }); },
    
    async addActivity(desc) {
        const payload = { id: 'act_'+Date.now(), desc, time: new Date().toISOString() };
        this.db.activities.unshift(payload);
        await this.apiCall('Activities', 'create', payload);
        this.checkNotifications();
    },

    async addNotification(desc) {
        const payload = { id: 'notif_'+Date.now(), desc, time: new Date().toISOString(), read: 'false' };
        this.db.notifications.unshift(payload);
        await this.apiCall('Notifications', 'create', payload);
        this.checkNotifications();
    },

    checkNotifications() {
        const unread = this.db.notifications.filter(n => n.read === 'false' || n.read === false).length;
        const badge = document.getElementById('notif-badge');
        const dropdown = document.getElementById('notif-dropdown');
        if (unread > 0) {
            badge.classList.remove('hidden');
            dropdown.innerHTML = this.db.notifications.slice(0, 10).map(n => `
                <div class="px-4 py-2 hover:bg-corp-black border-b border-corp-border ${(n.read === 'false' || n.read === false) ? 'text-white' : 'text-corp-text'}">
                    <p class="text-xs">${n.desc}</p>
                    <p class="text-[10px] text-zinc-600 mt-1">${this.formatDate(n.time)}</p>
                </div>
            `).join('');
        } else {
            badge.classList.add('hidden');
            dropdown.innerHTML = '<p class="px-4 py-2 text-xs text-corp-text">No new notifications</p>';
        }
    },

    openModal(title, bodyHtml) {
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-body').innerHTML = bodyHtml;
        document.getElementById('modal-overlay').classList.remove('hidden');
    },

    closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); },

    bindEvents() {
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const success = await this.login(document.getElementById('login-user').value, document.getElementById('login-pass').value, document.getElementById('remember-me').checked);
            if (!success) document.getElementById('login-error').classList.remove('hidden');
        });
        document.getElementById('toggle-pass').addEventListener('click', (e) => {
            const input = document.getElementById('login-pass');
            input.type = input.type === 'password' ? 'text' : 'password';
            e.target.textContent = input.type === 'password' ? 'SHOW' : 'HIDE';
        });
        document.getElementById('logout-btn').addEventListener('click', () => { this.logout(); });
        document.getElementById('menu-toggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('-translate-x-full'));
        document.getElementById('modal-close').addEventListener('click', () => this.closeModal());
        document.getElementById('modal-overlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) this.closeModal(); });
        document.getElementById('notif-btn').addEventListener('click', async () => {
            document.getElementById('notif-dropdown').classList.toggle('hidden');
            for(let n of this.db.notifications) { if(n.read === 'false' || n.read === false) { n.read = 'true'; await this.apiCall('Notifications', 'update', n, n.id); } }
            this.checkNotifications();
        });
    }
};

const Pages = {
    dashboard: {
        render() {
            const totalIncome = App.db.income.reduce((s, i) => s + parseFloat(i.amount || 0), 0);
            const totalExpenses = App.db.expenses.reduce((s, e) => s + parseFloat(e.amount || 0), 0);
            const totalSalaries = App.db.salaries.reduce((s, sly) => s + parseFloat(sly.amount || 0), 0);
            const totalSavings = App.db.savings.reduce((s, sv) => s + (sv.type === 'Deposit' ? parseFloat(sv.amount || 0) : -parseFloat(sv.amount || 0)), 0);
            const netProfit = totalIncome - totalExpenses - totalSalaries;
            
            let health = { text: '', color: '' };
            if (totalIncome === 0 && totalExpenses === 0) health = { text: 'No financial data yet.', color: 'text-zinc-500' };
            else if (netProfit > totalIncome * 0.3) health = { text: 'Income growth is strong and expenses remain controlled. Financial health is excellent.', color: 'text-green-400' };
            else if (netProfit > 0) health = { text: 'Revenue and expenses are balanced. Business performance remains stable.', color: 'text-blue-400' };
            else if (netProfit === 0) health = { text: 'Income covers expenses, but profit margins should improve.', color: 'text-yellow-400' };
            else if (netProfit < 0 && totalIncome > 0) health = { text: 'Expenses are rising faster than income. Spending should be reviewed.', color: 'text-orange-400' };
            else health = { text: 'Expenses exceed income. Immediate financial adjustments are recommended.', color: 'text-red-400' };

            const card = (label, value, color='text-white') => `<div class="bg-corp-panel border border-corp-border p-4 rounded"><p class="text-xs text-corp-text uppercase tracking-wider">${label}</p><p class="text-xl font-bold ${color} mt-1">${value}</p></div>`;

            return `
                <h2 class="text-xl font-bold text-white mb-6">Dashboard Overview</h2>
                <div class="bg-corp-panel border border-corp-border p-4 rounded mb-8">
                    <h3 class="text-xs font-medium text-corp-text uppercase tracking-wider mb-2">Financial Health Analysis</h3>
                    <p class="text-sm font-medium ${health.color}">${health.text}</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                    ${card('Total Income', App.formatCurrency(totalIncome), 'text-green-400')}
                    ${card('Total Expenses', App.formatCurrency(totalExpenses + totalSalaries), 'text-red-400')}
                    ${card('Net Profit', App.formatCurrency(netProfit), netProfit >= 0 ? 'text-green-400' : 'text-red-400')}
                    ${card('Company Savings', App.formatCurrency(totalSavings), 'text-purple-400')}
                    ${card('Total Salary Paid', App.formatCurrency(totalSalaries))}
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-corp-panel border border-corp-border p-4 rounded">
                        <h3 class="text-sm font-semibold mb-4 text-white">Recent Income</h3>
                        ${this.table(App.db.income.slice(0, 3), ['source', 'amount', 'date'])}
                    </div>
                    <div class="bg-corp-panel border border-corp-border p-4 rounded">
                        <h3 class="text-sm font-semibold mb-4 text-white">Recent Expenses</h3>
                        ${this.table(App.db.expenses.slice(0, 3), ['name', 'amount', 'date'])}
                    </div>
                </div>
            `;
        },
        table(data, cols) {
            if(!data.length) return '<p class="text-corp-text text-xs">No data</p>';
            return `<table class="w-full text-xs text-left"><tbody>${data.map(row => `<tr class="border-b border-corp-border"><td class="py-2 text-white">${row[cols[0]] || ''}</td><td class="py-2 text-purple-400">${App.formatCurrency(row[cols[1]])}</td><td class="py-2 text-corp-text text-right">${App.formatDate(row[cols[2]])}</td></tr>`).join('')}</tbody></table>`;
        }
    },

    members: {
        render() {
            return `
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-white">Member Management</h2>
                    <button id="add-member-btn" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded text-xs font-semibold transition-colors">Add Member</button>
                </div>
                <div id="members-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                    ${App.db.members.map(m => `
                        <div class="bg-corp-panel border border-corp-border p-4 rounded flex items-start gap-4">
                            <div class="w-16 h-16 rounded bg-corp-black border border-corp-border overflow-hidden shrink-0 flex items-center justify-center">
                                ${m.photo ? `<img src="${m.photo}" class="w-full h-full object-cover">` : `<span class="text-xl text-zinc-700">${(m.name || '?').charAt(0)}</span>`}
                            </div>
                            <div class="flex-1 min-w-0">
                                <h4 class="text-sm font-semibold text-white truncate">${m.name || 'Unknown'}</h4>
                                <p class="text-xs text-corp-text mt-0.5">${m.position || ''} - ${m.department || ''}</p>
                                <p class="text-xs text-purple-400 mt-1">${App.formatCurrency(m.salary)}</p>
                                <span class="inline-block mt-1 px-2 py-0.5 text-[10px] font-semibold rounded ${m.status === 'Active' ? 'bg-green-900/20 text-green-400' : 'bg-red-900/20 text-red-400'}">${m.status || 'N/A'}</span>
                            </div>
                            <div class="flex flex-col gap-1">
                                <button data-edit="${m.id}" class="text-[10px] text-corp-text hover:text-white">EDIT</button>
                                <button data-del="${m.id}" class="text-[10px] text-corp-text hover:text-red-400">DEL</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        },
        init() {
            document.getElementById('add-member-btn')?.addEventListener('click', () => this.showForm());
            document.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', (e) => this.showForm(e.target.dataset.edit)));
            document.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', async (e) => {
                await App.apiCall('Members', 'delete', null, e.target.dataset.del);
                App.addActivity('Deleted member record');
                await App.loadDb(); App.navigate('members');
            }));
        },
        showForm(id = null) {
            const m = id ? App.db.members.find(m => m.id === id) : null;
            App.openModal(id ? 'Edit Member' : 'Add Member', `
                <form id="member-form" class="space-y-4">
                    <div class="flex justify-center mb-4">
                        <label class="cursor-pointer">
                            <div id="photo-preview" class="w-24 h-24 rounded bg-corp-black border border-dashed border-corp-border flex items-center justify-center overflow-hidden hover:border-purple-500 transition-colors">
                                ${m?.photo ? `<img src="${m.photo}" class="w-full h-full object-cover">` : `<span class="text-[10px] text-corp-text text-center px-2">Upload Photo</span>`}
                            </div>
                            <input type="file" id="m-photo" class="hidden" accept="image/png, image/jpeg, image/webp">
                        </label>
                    </div>
                    <input type="hidden" id="m-id" value="${m?.id || ''}">
                    <input type="hidden" id="m-photo-data" value="${m?.photo || ''}">
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-[10px] text-corp-text uppercase">Full Name</label><input id="m-name" value="${m?.name || ''}" required class="w-full mt-1 p-2 bg-corp-black border border-corp-border rounded text-xs text-white outline-none"></div>
                        <div><label class="text-[10px] text-corp-text uppercase">Employee ID</label><input id="m-empid" value="${m?.empId || ''}" required class="w-full mt-1 p-2 bg-corp-black border border-corp-border rounded text-xs text-white outline-none"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-[10px] text-corp-text uppercase">Position</label><input id="m-pos" value="${m?.position || ''}" required class="w-full mt-1 p-2 bg-corp-black border border-corp-border rounded text-xs text-white outline-none"></div>
                        <div><label class="text-[10px] text-corp-text uppercase">Department</label><input id="m-dept" value="${m?.department || ''}" required class="w-full mt-1 p-2 bg-corp-black border border-corp-border rounded text-xs text-white outline-none"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-[10px] text-corp-text uppercase">Monthly Salary</label><input type="number" id="m-salary" value="${m?.salary || ''}" required class="w-full mt-1 p-2 bg-corp-black border border-corp-border rounded text-xs text-white outline-none"></div>
                        <div><label class="text-[10px] text-corp-text uppercase">Status</label><select id="m-status" class="w-full mt-1 p-2 bg-corp-black border border-corp-border rounded text-xs text-white outline-none"><option ${m?.status === 'Active' ? 'selected' : ''}>Active</option><option ${m?.status === 'Inactive' ? 'selected' : ''}>Inactive</option></select></div>
                    </div>
                    <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 py-2 rounded text-xs font-semibold transition-colors mt-2">Save Member</button>
                </form>
            `);
            
            document.getElementById('m-photo').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        const img = new Image();
                        img.onload = function() {
                            const canvas = document.createElement('canvas');
                            const maxSize = 200; let w = img.width, h = img.height;
                            if (w > h) { if (w > maxSize) { h *= maxSize / w; w = maxSize; } } else { if (h > maxSize) { w *= maxSize / h; h = maxSize; } }
                            canvas.width = w; canvas.height = h;
                            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                            document.getElementById('m-photo-data').value = dataUrl;
                            document.getElementById('photo-preview').innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover">`;
                        };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });

            document.getElementById('member-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = document.getElementById('m-id').value;
                const payload = {
                    id: id || 'mem_'+Date.now(), name: document.getElementById('m-name').value, empId: document.getElementById('m-empid').value,
                    position: document.getElementById('m-pos').value, department: document.getElementById('m-dept').value,
                    salary: document.getElementById('m-salary').value, status: document.getElementById('m-status').value,
                    photo: document.getElementById('m-photo-data').value
                };
                
                if (id) { await App.apiCall('Members', 'update', payload, id); App.addActivity(`Updated member: ${payload.name}`); } 
                else { await App.apiCall('Members', 'create', payload); App.addActivity(`Added member: ${payload.name}`); }
                
                App.closeModal(); await App.loadDb(); App.navigate('members');
            });
        }
    },

    salary: {
        render() {
            const totalPaid = App.db.salaries.reduce((s, r) => s + parseFloat(r.amount || 0), 0);
            return `
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-white">Salary Management</h2>
                    <button id="add-salary-btn" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded text-xs font-semibold transition-colors">Record Payment</button>
                </div>
                <div class="bg-corp-panel border border-corp-border p-4 rounded mb-6">
                    <p class="text-xs text-corp-text uppercase">Total Salary Paid</p>
                    <p class="text-xl font-bold text-white mt-1">${App.formatCurrency(totalPaid)}</p>
                </div>
                <div class="bg-corp-panel border border-corp-border rounded overflow-x-auto">
                    <table class="w-full text-xs text-left">
                        <thead class="bg-corp-black text-corp-text uppercase"><tr><th class="p-3">Employee</th><th class="p-3">Amount</th><th class="p-3">Date</th><th class="p-3">Status</th><th class="p-3">Action</th></tr></thead>
                        <tbody>${App.db.salaries.map(s => `<tr class="border-b border-corp-border hover:bg-corp-black/50"><td class="p-3 text-white">${s.name || ''}</td><td class="p-3 text-purple-400">${App.formatCurrency(s.amount)}</td><td class="p-3 text-corp-text">${App.formatDate(s.date)}</td><td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-semibold ${s.status === 'Paid' ? 'bg-green-900/20 text-green-400' : 'bg-yellow-900/20 text-yellow-400'}">${s.status || 'Pending'}</span></td><td class="p-3"><button data-del-sal="${s.id}" class="text-red-400 hover:text-red-300">Delete</button></td></tr>`).join('')}</tbody>
                    </table>
                </div>
            `;
        },
        init() {
            document.getElementById('add-salary-btn')?.addEventListener('click', () => {
                const opts = App.db.members.map(m => `<option value="${m.id}" data-name="${m.name}">${m.name}</option>`).join('');
                App.openModal('Record Salary', `
                    <form id="sal-form" class="space-y-4">
                        <div><label class="text-[10px] text-corp-text uppercase">Employee</label><select id="s-member" required class="w-full mt-1 p-2 bg-corp-black border border-corp-border rounded text-xs text-white outline-none">${opts}</select></div>
                        <div><label class="text-[10px] text-corp-text uppercase">Amount</label><input type="number" id="s-amount" required class="w-full mt-1 p-2 bg-corp-black border border-corp-border rounded text-xs text-white outline-none"></div>
                        <div><label class="text-[10px] text-corp-text uppercase">Date</label><input type="date" id="s-date" required class="w-full mt-1 p-2 bg-corp-black border border-corp-border rounded text-xs text-white outline-none"></div>
                        <div><label class="text-[10px] text-corp-text uppercase">Status</label><select id="s-status" class="w-full mt-1 p-2 bg-corp-black border border-corp-border rounded text-xs text-white outline-none"><option>Paid</option><option>Pending</option></select></div>
                        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 py-2 rounded text-xs font-semibold transition-colors">Save Payment</button>
                    </form>
                `);
                document.getElementById('s-member').addEventListener('change', (e) => {
                    const mem = App.db.members.find(m => m.id === e.target.value);
                    if(mem) document.getElementById('s-amount').value = mem.salary;
                });
                document.getElementById('sal-form').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const sel = document.getElementById('s-member');
                    const payload = { id: 'sal_'+Date.now(), memberId: sel.value, name: sel.options[sel.selectedIndex].dataset.name, amount: document.getElementById('s-amount').value, date: document.getElementById('s-date').value, status: document.getElementById('s-status').value };
                    await App.apiCall('Salaries', 'create', payload);
                    App.addActivity('Added salary payment');
                    App.closeModal(); await App.loadDb(); App.navigate('salary');
                });
            });
            document.querySelectorAll('[data-del-sal]').forEach(btn => btn.addEventListener('click', async (e) => {
                await App.apiCall('Salaries', 'delete', null, e.target.dataset.delSal);
                App.addActivity('Deleted salary record');
                await App.loadDb(); App.navigate('salary');
            }));
        }
    },

    income: {
        render() { return this.page('income', 'Income', ['Client Payments','Donations','Sponsorships','Investments','Other Revenue']); },
        init() { this.initPage('income', 'source', 'Income'); },
        page(type, title, cats) {
            const data = App.db[type]; const total = data.reduce((s, i) => s + parseFloat(i.amount || 0), 0);
            return `
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-white">${title} Management</h2>
                    <button id="add-fin-btn" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded text-xs font-semibold transition-colors">Add ${title}</button>
                </div>
                <div class="bg-corp-panel border border-corp-border p-4 rounded mb-6">
                    <p class="text-xs text-corp-text uppercase">Total ${title}</p>
                    <p class="text-xl font-bold text-green-400 mt-1">${App.formatCurrency(total)}</p>
                </div>
                <div class="bg-corp-panel border border-corp-border rounded overflow-x-auto">
                    <table class="w-full text-xs text-left">
                        <thead class="bg-corp-black text-corp-text uppercase"><tr><th class="p-3">Name</th><th class="p-3">Category</th><th class="p-3">Amount</th><th class="p-3">Date</th><th class="p-3">Action</th></tr></thead>
                        <tbody>${data.map(i => `<tr class="border-b border-corp-border hover:bg-corp-black/50"><td class="p-3 text-white">${type === 'income' ? i.source : i.name}</td><td class="p-3 text-corp-text"><span class="px-2 py-0.5 bg-corp-black rounded">${i.category || ''}</span></td><td class="p-3 text-purple-400">${App.formatCurrency(i.amount)}</td><td class="p-3 text-corp-text">${App.formatDate(i.date)}</td><td class="p-3"><button data-del-fin="${i.id}" class="text-red-400 hover:text-red-300">Delete</button></td></tr>`).join('')}</tbody>
                    </table>
                </div>
            `;
        },
        initPage(type, field, title) {
            const catsArr = type === 'income' ? ['Client Payments','Donations','Sponsorships','Investments','Other Revenue'] : ['Salaries','Software','Marketing','Equipment','Office','Miscellaneous'];
            document.getElementById('add-fin-btn')?.addEventListener('click', () => {
                App.openModal(`Add ${title}`, `
                    <form id="fin-form" class="space-y-4">
                        <div><label class="text-[10px] text-corp-text uppercase">Name/Source</label><input id="f-name" required class="w-full mt-1 p-2 bg-corp-black border border-corp-border rounded text-xs text-white outline-none"></div>
                        <div><label class="text-[10px] text-corp-text uppercase">Amount</label><input type="number" id="f-amount" required class="w-full mt-1 p-2 bg-corp-black border border-corp-border rounded text-xs text-white outline-none"></div>
                        <div><label class="text-[10px] text-corp-text uppercase">Category</label><select id="f-cat" class="w-full mt-1 p-2 bg-corp-black border border-corp-border rounded text-xs text-white outline-none">${catsArr.map(c=>`<option>${c}</option>`).join('')}</select></div>
                        <div><label class="text-[10px] text-corp-text uppercase">Date</label><input type="date" id="f-date" required class="w-full mt-1 p-2 bg-corp-black border border-corp-border rounded text-xs text-white outline-none"></div>
                        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 py-2 rounded text-xs font-semibold transition-colors">Save</button>
                    </form>
                `);
                document.getElementById('fin-form').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const payload = { id: type.charAt(0)+'_'+Date.now(), [field]: document.getElementById('f-name').value, amount: document.getElementById('f-amount').value, category: document.getElementById('f-cat').value, date: document.getElementById('f-date').value, desc: '' };
                    await App.apiCall(type.charAt(0).toUpperCase() + type.slice(1), 'create', payload);
                    App.addActivity(`Added ${title} record`);
                    App.closeModal(); await App.loadDb(); App.navigate(type);
                });
            });
            document.querySelectorAll('[data-del-fin]').forEach(btn => btn.addEventListener('click', async (e) => {
                const table = type.charAt(0).toUpperCase() + type.slice(1);
                await App.apiCall(table, 'delete', null, e.target.dataset.delFin);
                App.addActivity(`Deleted ${title} record`);
                await App.loadDb(); App.navigate(type);
            }));
        }
    },

    expenses: {
        render() { return Pages.income.page('expenses', 'Expenses', ['Salaries','Software','Marketing','Equipment','Office','Miscellaneous']); },
        init() { return Pages.income.initPage('expenses', 'name', 'Expenses'); }
    },

    savings: {
        render() {
            const balance = App.db.savings.reduce((s, r) => s + (r.type === 'Deposit' ? parseFloat(r.amount || 0) : -parseFloat(r.amount || 0)), 0);
            return `
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-white">Company Savings</h2>
                    <div class="flex gap-2">
                        <button id="add-deposit" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded text-xs font-semibold transition-colors">Deposit</button>
                        <button id="add-withdraw" class="bg-corp-panel border border-corp-border hover:bg-corp-black px-4 py-2 rounded text-xs font-semibold transition-colors">Withdraw</button>
                    </div>
                </div>
                <div class="bg-corp-panel border border-corp-border p-4 rounded mb-6">
                    <p class="text-xs text-corp-text uppercase">Total Savings Balance</p>
                    <p class="text-xl font-bold text-purple-400 mt-1">${App.formatCurrency(balance)}</p>
                </div>
                <div class="bg-corp-panel border border-corp-border rounded overflow-x-auto">
                    <table class="w-full text-xs text-left">
                        <thead class="bg-corp-black text-corp-text uppercase"><tr><th class="p-3">Type</th><th class="p-3">Amount</th><th class="p-3">Date</th><th class="p-3">Description</th><th class="p-3">Action</th></tr></thead>
                        <tbody>${App.db.savings.map(i => `<tr class="border-b border-corp-border hover:bg-corp-black/50"><td class="p-3 ${i.type === 'Deposit' ? 'text-green-400' : 'text-red-400'}">${i.type}</td><td class="p-3 text-white">${App.formatCurrency(i.amount)}</td><td class="p-3 text-corp-text">${App.formatDate(i.date)}</td><td class="p-3 text-corp-text">${i.desc || 'N/A'}</td><td class="p-3"><button data-del-sav="${i.id}" class="text-red-400 hover:text-red-300">Delete</button></td></tr>`).join('')}</tbody>
                    </table>
                </div>
            `;
        },
        init() {
            const form = (type) => `
                <form id="sav-form" class="space-y-4">
                    <input type="hidden" id="sv-type" value="${type}">
                    <div><label class="text-[10px] text-corp-text uppercase">Amount</label><input type="number" id="sv-amount" required class="w-full mt-1 p-2 bg-corp-black border border-corp-border rounded text-xs text-white outline-none"></div>
                    <div><label class="text-[10px] text-corp-text uppercase">Date</label><input type="date" id="sv-date" required class="w-full mt-1 p-2 bg-corp-black border border-corp-border rounded text-xs text-white outline-none"></div>
                    <div><label class="text-[10px] text-corp-text uppercase">Description</label><input id="sv-desc" class="w-full mt-1 p-2 bg-corp-black border border-corp-border rounded text-xs text-white outline-none"></div>
                    <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 py-2 rounded text-xs font-semibold transition-colors">Save</button>
                </form>
            `;
            document.getElementById('add-deposit')?.addEventListener('click', () => { App.openModal('Deposit Savings', form('Deposit')); this.bindForm(); });
            document.getElementById('add-withdraw')?.addEventListener('click', () => { App.openModal('Withdraw Savings', form('Withdraw')); this.bindForm(); });
            document.querySelectorAll('[data-del-sav]').forEach(btn => btn.addEventListener('click', async (e) => {
                await App.apiCall('Savings', 'delete', null, e.target.dataset.delSav);
                App.addActivity('Deleted savings record');
                await App.loadDb(); App.navigate('savings');
            }));
        },
        bindForm() {
            document.getElementById('sav-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const payload = { id: 'sav_'+Date.now(), type: document.getElementById('sv-type').value, amount: document.getElementById('sv-amount').value, date: document.getElementById('sv-date').value, desc: document.getElementById('sv-desc').value };
                await App.apiCall('Savings', 'create', payload);
                App.addActivity(`Recorded ${payload.type} in savings`);
                App.closeModal(); await App.loadDb(); App.navigate('savings');
            });
        }
    },

    reports: {
        render() {
            return `
                <h2 class="text-xl font-bold text-white mb-6">Reports & Export</h2>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-corp-panel border border-corp-border p-6 rounded">
                        <h3 class="text-sm font-semibold mb-4 text-white">Generate & Export Reports</h3>
                        <div class="space-y-2">
                            <button data-report="income" class="w-full text-left px-4 py-3 bg-corp-black border border-corp-border rounded hover:border-purple-500 transition-colors text-xs text-corp-text hover:text-white">Income Report</button>
                            <button data-report="expenses" class="w-full text-left px-4 py-3 bg-corp-black border border-corp-border rounded hover:border-purple-500 transition-colors text-xs text-corp-text hover:text-white">Expenses Report</button>
                            <button data-report="salaries" class="w-full text-left px-4 py-3 bg-corp-black border border-corp-border rounded hover:border-purple-500 transition-colors text-xs text-corp-text hover:text-white">Salary Report</button>
                            <button data-report="savings" class="w-full text-left px-4 py-3 bg-corp-black border border-corp-border rounded hover:border-purple-500 transition-colors text-xs text-corp-text hover:text-white">Savings Report</button>
                        </div>
                    </div>
                    <div class="bg-corp-panel border border-corp-border p-6 rounded">
                        <h3 class="text-sm font-semibold mb-4 text-white">Activity Log</h3>
                        <div class="space-y-2 max-h-80 overflow-y-auto pr-2">
                            ${App.db.activities.map(a => `<div class="text-[11px] border-b border-corp-border pb-2"><span class="text-zinc-600">${a.time ? new Date(a.time).toLocaleString() : ''}</span><br><span class="text-corp-text">${a.desc || ''}</span></div>`).join('')}
                        </div>
                    </div>
                </div>
            `;
        },
        init() {
            document.querySelectorAll('[data-report]').forEach(btn => btn.addEventListener('click', (e) => this.generate(e.target.dataset.report)));
        },
        generate(type) {
            let data = App.db[type]; let title = ""; let headers = [];
            if (type === 'income') { title = "Income Report"; headers = ['Source', 'Category', 'Amount', 'Date']; }
            else if (type === 'expenses') { title = "Expenses Report"; headers = ['Name', 'Category', 'Amount', 'Date']; }
            else if (type === 'salaries') { title = "Salary Report"; headers = ['Employee', 'Amount', 'Date', 'Status']; }
            else if (type === 'savings') { title = "Savings Report"; headers = ['Type', 'Amount', 'Date', 'Description']; }
            
            if(!data.length) { App.addNotification(`Cannot export empty ${type} report`); alert("No data to export!"); return; }

            App.openModal(`Export ${title}`, `
                <div class="space-y-4">
                    <p class="text-xs text-corp-text">Exporting ${data.length} records.</p>
                    <div class="grid grid-cols-3 gap-2">
                        <button id="exp-pdf" class="bg-purple-600 hover:bg-purple-700 py-2 rounded text-xs font-semibold transition-colors">PDF</button>
                        <button id="exp-xlsx" class="bg-corp-black border border-corp-border hover:border-purple-500 py-2 rounded text-xs font-semibold transition-colors text-white">Excel</button>
                        <button id="exp-csv" class="bg-corp-black border border-corp-border hover:border-purple-500 py-2 rounded text-xs font-semibold transition-colors text-white">CSV</button>
                    </div>
                </div>
            `);
            document.getElementById('exp-pdf').addEventListener('click', () => this.exportPDF(title, data, headers, type));
            document.getElementById('exp-xlsx').addEventListener('click', () => this.exportXLS(title, data, headers, type));
            document.getElementById('exp-csv').addEventListener('click', () => this.exportCSV(title, data, headers, type));
        },
        exportPDF(title, data, headers, type) {
            const { jsPDF } = window.jspdf; const doc = new jsPDF();
            doc.setTextColor(255, 255, 255); doc.setFontSize(18); doc.text(`TyPixel - ${title}`, 14, 22);
            doc.setFontSize(10); doc.setTextColor(150, 150, 150); doc.text(`Generated: ${new Date().toLocaleString()}`, 14, 30);
            let y = 40; doc.setFontSize(11); doc.setTextColor(200, 200, 200);
            headers.forEach((h, i) => doc.text(h, 14 + (i * 45), y));
            y += 10; doc.setTextColor(255, 255, 255);
            data.forEach(row => {
                if(y > 280) { doc.addPage(); y = 20; }
                let col1 = type === 'income' ? row.source : (type === 'expenses' ? row.name : (type === 'salaries' ? row.name : row.type));
                doc.text(String(col1 || ''), 14, y);
                doc.text(String(row.category || row.status || row.type || ''), 59, y);
                doc.text(String(App.formatCurrency(row.amount)), 104, y);
                doc.text(String(row.date || row.desc || ''), 149, y);
                y += 8;
            });
            doc.save(`${title.replace(/\s/g, '_')}.pdf`);
            App.addActivity(`Exported PDF: ${title}`); App.closeModal();
        },
        exportXLS(title, data, headers, type) {
            const ws_data = [headers];
            data.forEach(row => {
                let col1 = type === 'income' ? row.source : (type === 'expenses' ? row.name : (type === 'salaries' ? row.name : row.type));
                let r = [col1, row.category || row.status || row.type || '', row.amount, row.date || row.desc || ''];
                ws_data.push(r);
            });
            const ws = XLSX.utils.aoa_to_sheet(ws_data); const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Report"); XLSX.writeFile(wb, `${title.replace(/\s/g, '_')}.xlsx`);
            App.addActivity(`Exported Excel: ${title}`); App.closeModal();
        },
        exportCSV(title, data, headers, type) {
            let csv = headers.join(',') + '\n';
            data.forEach(row => {
                let col1 = type === 'income' ? row.source : (type === 'expenses' ? row.name : (type === 'salaries' ? row.name : row.type));
                let r = [col1, row.category || row.status || row.type || '', row.amount, row.date || row.desc || ''];
                csv += r.map(v => `"${v}"`).join(',') + '\n';
            });
            const blob = new Blob([csv], { type: 'text/csv' }); const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `${title.replace(/\s/g, '_')}.csv`; a.click();
            App.addActivity(`Exported CSV: ${title}`); App.closeModal();
        }
    }
};

document.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
